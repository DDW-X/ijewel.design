<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171d" />
      <stop offset="100%" stop-color="#0a0c0e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae084" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa8222" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad)" />
  <!-- Diamond gem shape -->
  <polygon points="200,100 270,160 200,280 130,160" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8" />
  <polygon points="170,160 200,100 230,160 200,280" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5" />
  <line x1="130" y1="160" x2="270" y2="160" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8" />
  <!-- Ring circle halo -->
  <circle cx="200" cy="190" r="100" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />
  <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle" letter-spacing="2">3D JEWELRY DESIGN</text>
</svg>
